name: Code Coverage

on:
  push:
    branches:
      - master
  pull_request: {}

permissions:
  contents: read

jobs:
  cover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:5.0.7
        ports:
          - 6379:6379
        options: >-
          --entrypoint redis-server
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust coverage tools
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: ""
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - name: Install Protoc
        uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate code coverage
        # Keep the existing report exclusions without excluding any workspace tests.
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --workspace --all-features --tests --no-cfg-coverage \
            --lcov --output-path target/llvm-cov/lcov.info \
            --ignore-filename-regex '(^|/)(examples|poem-derive|poem-openapi-derive|poem-grpc-build)/'
          test -s target/llvm-cov/lcov.info
      - name: Check Dependabot Codecov token
        if: >-
          github.event_name == 'pull_request' &&
          github.actor == 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        id: codecov-token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [[ -z "$CODECOV_TOKEN" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Codecov upload skipped: add CODECOV_TOKEN as a Dependabot secret to enable coverage reports for Dependabot PRs."
            echo "Codecov upload skipped: CODECOV_TOKEN is not configured as a Dependabot secret. Coverage generation and tests still ran." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload To codecov.io
        # Public fork PRs use Codecov's tokenless upload support.
        if: steps.codecov-token.outputs.skip != 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/lcov.info
          disable_search: true
          fail_ci_if_error: true
