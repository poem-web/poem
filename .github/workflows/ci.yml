name: CI

on:
  push:
    branches:
      - master
  pull_request: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: poem-derive
            path: poem-derive
          - name: poem
            path: poem
          - name: poem-openapi-derive
            path: poem-openapi-derive
          - name: poem-openapi
            path: poem-openapi
          - name: poem-lambda
            path: poem-lambda
          - name: poem-grpc-build
            path: poem-grpc-build
          - name: poem-grpc
            path: poem-grpc
          - name: poem-mcpserver-macros
            path: poem-mcpserver-macros
          - name: poem-mcpserver
            path: poem-mcpserver
    services:
      redis:
        image: redis:5.0.7
        ports:
          - 6379:6379
        options: --entrypoint redis-server
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        options: -e MYSQL_ROOT_PASSWORD=123456 -e MYSQL_DATABASE=test_poem_sessions
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        options: -e POSTGRES_PASSWORD=123456 -e POSTGRES_DB=test_poem_sessions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep v1 warning behavior, including on the Rust 1.94 MSRV.
      # Only the explicit compilation cache below owns Rust artifacts.
      # Use nightly Rust to check the format
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: "-D warnings"
          build-warnings: ""
          toolchain: nightly
          components: rustfmt, clippy
          override: true
      - name: Check Format
        run: cargo fmt --all -- --check
      # Switch to stable Rust
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: "-D warnings"
          build-warnings: ""
          toolchain: stable
          components: rustfmt, clippy
          override: true
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.package.name }}
      - name: Install Protoc
        if: matrix.package.name == 'poem-grpc' || matrix.package.name == 'poem-openapi'
        uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Do tests
      - name: Check With Clippy
        run: cargo clippy --all-features
        working-directory: ${{ matrix.package.path }}

      - name: Run Tests
        run: cargo test --all-features
        working-directory: ${{ matrix.package.path }}

  check-examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Protoc
        uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Use nightly Rust to check the format
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: "-D warnings"
          build-warnings: ""
          toolchain: nightly
          components: rustfmt, clippy
      - name: Check Format
        run: cargo fmt --all -- --check
        working-directory: examples
      # Switch to stable Rust
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: "-D warnings"
          build-warnings: ""
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples -> target
      - name: Check With Clippy
        run: cargo clippy
        working-directory: examples

  check-msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: "-D warnings"
          build-warnings: ""
          toolchain: "1.94.0"
      - name: Install Protoc
        uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: Check minimum supported Rust version
        run: cargo check --workspace --all-features --all-targets

  check-worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: "-D warnings"
          build-warnings: ""
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/poem/worker-hello-world -> target
      - name: Check native Poem without server features
        run: cargo check -p poem --no-default-features
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Check Cloudflare Worker example
        run: cargo check --target wasm32-unknown-unknown
        working-directory: examples/poem/worker-hello-world

  check-licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          toolchain: "1.94.0"
      - name: Check license symlinks
        run: python3 scripts/check-licenses.py
      - name: Package workspace crates
        run: cargo package --workspace --no-verify
      - name: Check packaged license contents
        run: python3 scripts/check-licenses.py --archives
