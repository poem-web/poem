[workspace]
resolver = "2"
members = [
    "poem-derive",
    "poem",
    "poem-openapi-derive",
    "poem-openapi",
    "poem-lambda",
    "poem-grpc-build",
    "poem-grpc",
    "poem-mcpserver",
    "poem-mcpserver-macros",
    "poem-worker",
]

[workspace.package]
authors = ["sunli <scott_s829@163.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/poem/"
homepage = "https://github.com/poem-web/poem"
repository = "https://github.com/poem-web/poem"
rust-version = "1.94"

[workspace.dependencies]
poem = { path = "poem", version = "3.1.12", default-features = false }
poem-derive = { path = "poem-derive", version = "3.1.12" }
poem-openapi-derive = { path = "poem-openapi-derive", version = "5.1.15" }
poem-grpc-build = { path = "poem-grpc-build", version = "0.5.9" }
poem-mcpserver-macros = { path = "poem-mcpserver-macros", version = "0.3.1" }

proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6" }
tokio = "1.53.1"
serde_json = "1.0.151"
sonic-rs = "0.5.10"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
regex = "1.13.1"
mime = "0.3.17"
tracing = "0.1.44"
chrono = { version = "0.4.45", default-features = false }
bytes = "1.12.1"
futures-util = "0.3.34"
tokio-stream = "0.1.19"
serde_yaml = "0.9.34"
quick-xml = { version = "0.42.0", features = ["serialize"] }
base64 = "0.23.1"
serde_urlencoded = "0.7.1"
indexmap = "2.14.2"
reqwest = { version = "0.13.5", default-features = false }
darling = "0.24.1"
http = "1.5.0"
async-stream = "0.3.6"
tokio-util = "0.7.19"
rand = "0.10.3"
time = "0.3.55"
schemars = "1.2.2"

# rustls, update together
rustls = "0.23.45"
tokio-rustls = "0.26.6"
