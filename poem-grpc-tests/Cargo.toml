[package]
name = "poem-grpc-tests"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Tests for poem-grpc that need generated code, kept out of poem-grpc's build script."

[dev-dependencies]
async-stream.workspace = true
bytes.workspace = true
futures-util.workspace = true
poem = { workspace = true, default-features = true }
poem-grpc = { path = "../poem-grpc", features = ["gzip"] }
percent-encoding = "2.3.2"
prost = "0.14.4"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
poem-grpc-build.workspace = true
